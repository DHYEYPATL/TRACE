site: branch-mumbai-042
timezone: Asia/Kolkata
profile: production

business_hours:
  days: [Mon, Tue, Wed, Thu, Fri, Sat]
  start: "09:30"
  end: "18:30"

cameras:
  - id: cam-1
    name: "Branch Vault Main Camera"
    source: "rtsp://10.20.1.50:554/live/stream1"
    process_fps: 5
    width: 1920
    height: 1080

assets:
  - id: safe-01
    name: "Cash Vault Safe"
    class: safe
    criticality: 3
    mode: fixed
    camera_id: cam-1
    tag_id: 101
    region: [[200, 250], [450, 250], [450, 600], [200, 600]]
    zone: [[170, 220], [480, 220], [480, 630], [170, 630]]
    thresholds:
      move_frac: 0.10
      present: 0.75

half_lives_s:
  demo:
    safe: 40.0
    gold_machine: 40.0
    printer: 30.0
    laptop: 20.0
    chair: 20.0
    stationery: 15.0
    other: 25.0
  production:
    safe: 1800.0
    gold_machine: 1800.0
    printer: 900.0
    laptop: 300.0
    chair: 300.0
    stationery: 120.0
    other: 300.0

timers:
  demo:
    missing_wait_s: 15
    new_object_s: 8
    swap_s: 10
    obstruction_hold_s: 1.5
    obstruction_release_s: 3.0
    moved_votes: 5
    returned_hold_s: 5.0
  production:
    missing_wait_s: 60
    new_object_s: 20
    swap_s: 10
    obstruction_hold_s: 2.0
    obstruction_release_s: 4.0
    moved_votes: 5
    returned_hold_s: 5.0

alerts:
  telegram:
    enabled: true
    chat_id: "${TELEGRAM_CHAT_ID}"
    bot_token: "${TELEGRAM_BOT_TOKEN}"
  ntfy:
    enabled: true
    topic: "trace-lnt-branch-042"
  escalate_after_s:
    high: 300
    medium: 900

ledger:
  anchor_every_s: 60
  anchor_channels: ["local_file", "telegram"]
  key_file: "data/signing_key.hex"

privacy:
  mask_people: true
  retention_days: 30

security:
  demo_mode: false
  require_auth: true
  admin_token: "${TRACE_ADMIN_TOKEN}"
  operator_token: "${TRACE_OPERATOR_TOKEN}"
  viewer_token: "${TRACE_VIEWER_TOKEN}"
