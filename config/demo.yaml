site: demo-branch-01
timezone: Asia/Kolkata
profile: demo # demo or production: picks half-lives and timers

business_hours:
  days: [Mon, Tue, Wed, Thu, Fri, Sat]
  start: "09:30"
  end: "18:30"

cameras:
  - id: cam-1
    name: "Main Branch Vault & Counter Camera"
    source: "synthetic" # 'synthetic', 'webcam:0', or 'file:clips/demo.mp4'
    process_fps: 5
    width: 1280
    height: 720

assets:
  - id: safe-02
    name: "Cash & Gold Safe"
    class: safe
    criticality: 3
    mode: fixed
    camera_id: cam-1
    tag_id: 12
    region: [[180, 220], [380, 220], [380, 520], [180, 520]]
    zone: [[150, 190], [410, 190], [410, 550], [150, 550]]
    thresholds:
      move_frac: 0.10
      present: 0.72

  - id: printer-01
    name: "Document Laser Printer"
    class: printer
    criticality: 2
    mode: fixed
    camera_id: cam-1
    tag_id: 24
    region: [[520, 260], [740, 260], [740, 480], [520, 480]]
    zone: [[490, 230], [770, 230], [770, 510], [490, 510]]
    thresholds:
      move_frac: 0.15
      present: 0.70

  - id: laptop-03
    name: "Manager Workstation Laptop"
    class: laptop
    criticality: 1
    mode: mobile
    camera_id: cam-1
    tag_id: 31
    region: [[880, 310], [1100, 310], [1100, 500], [880, 500]]
    zone: [[840, 270], [1140, 270], [1140, 540], [840, 540]]
    thresholds:
      move_frac: 0.25
      present: 0.68

half_lives_s:
  demo:
    safe: 40.0
    gold_machine: 40.0
    printer: 30.0
    laptop: 20.0
    chair: 20.0
    stationery: 15.0
    other: 25.0
  production:
    safe: 1800.0
    gold_machine: 1800.0
    printer: 900.0
    laptop: 300.0
    chair: 300.0
    stationery: 120.0
    other: 300.0

timers:
  demo:
    missing_wait_s: 15
    new_object_s: 8
    swap_s: 10
    obstruction_hold_s: 1.5
    obstruction_release_s: 3.0
    moved_votes: 5
    returned_hold_s: 5.0
  production:
    missing_wait_s: 60
    new_object_s: 20
    swap_s: 10
    obstruction_hold_s: 2.0
    obstruction_release_s: 4.0
    moved_votes: 5
    returned_hold_s: 5.0

alerts:
  telegram:
    enabled: false
    chat_id: ""
    bot_token: ""
  ntfy:
    enabled: false
    topic: "trace-alerts-demo"
  escalate_after_s:
    high: 300
    medium: 900

ledger:
  anchor_every_s: 60
  anchor_channels: ["local_file"]
  key_file: "data/signing_key.hex"

privacy:
  mask_people: true
  retention_days: 30
